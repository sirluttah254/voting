<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Portal | Blue & White</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { brand: { light: '#eff6ff', DEFAULT: '#2563eb', dark: '#1e40af' } } }
            }
        }
    </script>
</head>
<body class="bg-brand-light font-sans text-gray-800">

    <!-- Header -->
    <header class="bg-brand text-white py-6 shadow-md text-center">
        <h1 class="text-3xl font-bold uppercase tracking-wide">Official Voting Portal</h1>
        <p class="text-blue-200 mt-2">1 Vote = KSh 10</p>
    </header>

    <!-- Candidates Section -->
    <main class="max-w-4xl mx-auto px-4 py-12">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- Candidate 1 -->
            <div class="bg-white rounded-xl shadow-lg p-6 border-t-4 border-brand text-center">
                <div class="w-32 h-32 mx-auto bg-gray-200 rounded-full mb-4 overflow-hidden border-4 border-brand-light">
                    <!-- Replace src with actual image URL -->
                    <img src="https://ui-avatars.com/api/?name=Luqman+Sumba&background=2563eb&color=fff&size=128" alt="Luqman Sumba" class="w-full h-full object-cover">
                </div>
                <h2 class="text-2xl font-bold text-brand-dark mb-2">Luqman Sumba</h2>
                <p class="text-gray-500 mb-6">Candidate ID: #001</p>
                <button onclick="openModal('Luqman Sumba', '001')" class="w-full bg-brand hover:bg-brand-dark text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                    Vote for Luqman
                </button>
            </div>

            <!-- Candidate 2 -->
            <div class="bg-white rounded-xl shadow-lg p-6 border-t-4 border-brand text-center">
                <div class="w-32 h-32 mx-auto bg-gray-200 rounded-full mb-4 overflow-hidden border-4 border-brand-light">
                    <!-- Replace src with actual image URL -->
                    <img src="https://ui-avatars.com/api/?name=Caeser+Olwaminabo&background=2563eb&color=fff&size=128" alt="Caeser Olwaminabo" class="w-full h-full object-cover">
                </div>
                <h2 class="text-2xl font-bold text-brand-dark mb-2">Caeser Olwaminabo</h2>
                <p class="text-gray-500 mb-6">Candidate ID: #002</p>
                <button onclick="openModal('Caeser Olwaminabo', '002')" class="w-full bg-brand hover:bg-brand-dark text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                    Vote for Caeser
                </button>
            </div>

        </div>
    </main>

    <!-- Payment Modal -->
    <div id="voteModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-800 text-2xl">&times;</button>
            
            <h3 class="text-xl font-bold text-brand-dark mb-4 border-b pb-2">Cast your vote</h3>
            
            <p class="mb-4">Voting for: <strong id="modalCandidateName" class="text-brand"></strong></p>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Number of Votes</label>
                <input type="number" id="voteCount" min="1" value="1" oninput="updateCost()" class="w-full px-4 py-2 border rounded-lg focus:ring-brand focus:border-brand">
            </div>

            <div class="bg-brand-light p-3 rounded-lg mb-4 text-center border border-blue-200">
                <span class="text-sm text-gray-600">Total Amount:</span>
                <span class="block text-2xl font-bold text-brand">KSh <span id="totalCost">10</span></span>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">M-Pesa Number</label>
                <input type="tel" id="phoneNumber" placeholder="07XXXXXXXX or 2547XXXXXXXX" class="w-full px-4 py-2 border rounded-lg focus:ring-brand focus:border-brand">
            </div>

            <button id="payBtn" onclick="initiatePayment()" class="w-full bg-brand hover:bg-brand-dark text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                Pay & Vote
            </button>

            <!-- Status Indicator -->
            <div id="statusMessage" class="hidden mt-4 text-center text-sm font-medium p-3 rounded-lg"></div>
        </div>
    </div>

    <script>
        // REPLACE THIS with your Render/Railway backend URL once deployed
        const BACKEND_URL = "http://localhost:3000"; 
        
        let currentCandidateId = '';
        const COST_PER_VOTE = 10;

        function openModal(name, id) {
            document.getElementById('modalCandidateName').innerText = name;
            currentCandidateId = id;
            document.getElementById('voteModal').classList.remove('hidden');
            resetModal();
        }

        function closeModal() {
            document.getElementById('voteModal').classList.add('hidden');
        }

        function updateCost() {
            const votes = document.getElementById('voteCount').value;
            document.getElementById('totalCost').innerText = (votes * COST_PER_VOTE).toLocaleString();
        }

        function resetModal() {
            document.getElementById('voteCount').value = 1;
            document.getElementById('phoneNumber').value = '';
            document.getElementById('statusMessage').classList.add('hidden');
            document.getElementById('payBtn').disabled = false;
            document.getElementById('payBtn').innerText = 'Pay & Vote';
            updateCost();
        }

        async function initiatePayment() {
            const phone = document.getElementById('phoneNumber').value;
            const votes = document.getElementById('voteCount').value;
            const statusDiv = document.getElementById('statusMessage');
            const btn = document.getElementById('payBtn');

            if(!phone || phone.length < 10) {
                alert("Please enter a valid M-Pesa number");
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Sending Prompt...';

            try {
                const response = await fetch(`${BACKEND_URL}/api/vote`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, candidateId: currentCandidateId, votes: parseInt(votes) })
                });
                
                const data = await response.json();

                if (data.CheckoutRequestID) {
                    btn.innerText = 'Check your phone';
                    statusDiv.classList.remove('hidden', 'bg-red-100', 'text-red-700');
                    statusDiv.classList.add('bg-blue-100', 'text-blue-700');
                    statusDiv.innerText = 'M-Pesa Prompt sent! Enter PIN to confirm...';
                    
                    // Start polling for payment status
                    pollTransactionStatus(data.CheckoutRequestID);
                } else {
                    throw new Error("Failed to initiate payment");
                }
            } catch (error) {
                btn.disabled = false;
                btn.innerText = 'Pay & Vote';
                statusDiv.classList.remove('hidden', 'bg-blue-100', 'text-blue-700');
                statusDiv.classList.add('bg-red-100', 'text-red-700');
                statusDiv.innerText = 'Error connecting to M-Pesa. Try again.';
            }
        }

        async function pollTransactionStatus(checkoutRequestId) {
            const statusDiv = document.getElementById('statusMessage');
            
            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`${BACKEND_URL}/api/status/${checkoutRequestId}`);
                    const data = await res.json();

                    if (data.status === 'COMPLETED') {
                        clearInterval(interval);
                        statusDiv.classList.replace('bg-blue-100', 'bg-green-100');
                        statusDiv.classList.replace('text-blue-700', 'text-green-700');
                        statusDiv.innerText = 'Payment Successful! Votes Added.';
                        setTimeout(closeModal, 3000);
                    } else if (data.status === 'FAILED') {
                        clearInterval(interval);
                        statusDiv.classList.replace('bg-blue-100', 'bg-red-100');
                        statusDiv.classList.replace('text-blue-700', 'text-red-700');
                        statusDiv.innerText = 'Payment Failed or Cancelled.';
                        document.getElementById('payBtn').disabled = false;
                        document.getElementById('payBtn').innerText = 'Try Again';
                    }
                } catch (e) {
                    console.error("Polling error", e);
                }
            }, 3000); // Check every 3 seconds
        }
    </script>
</body>
</html>
