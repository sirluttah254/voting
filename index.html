<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEST FANS OF THE SEASON</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Paystack Inline JS -->
    <script src="https://js.paystack.co/v1/inline.js"></script>
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // --- YOUR FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyD4MwMp_M7n74eCwMqrWW8CG983-qoeCTA",
            authDomain: "fanvote-b8eec.firebaseapp.com",
            databaseURL: "https://fanvote-b8eec-default-rtdb.firebaseio.com",
            projectId: "fanvote-b8eec",
            storageBucket: "fanvote-b8eec.appspot.com",
            messagingSenderId: "668583002229",
            appId: "1:668583002229:web:5ffa44d78fcc36f118b83c"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const COST_PER_VOTE = 10;
        let currentCandidateId = '';
        let isVotingOpen = true;

        // --- REAL-TIME DATABASE LISTENER ---
        const votesRef = ref(db, 'votes');
        onValue(votesRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                updateDisplayStats(data);
            }
        });

        // --- DISPLAY LOGIC ---
        function updateDisplayStats(votesData) {
            const totalVotes = Object.values(votesData).reduce((a, b) => a + b, 0);
            document.getElementById('total-votes-display').innerText = totalVotes.toLocaleString();

            for (const [id, count] of Object.entries(votesData)) {
                const perc = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
                if(document.getElementById(`votes-${id}`)) document.getElementById(`votes-${id}`).innerText = count.toLocaleString();
                if(document.getElementById(`perc-${id}`)) document.getElementById(`perc-${id}`).innerText = `${perc}%`;
                if(document.getElementById(`bar-${id}`)) document.getElementById(`bar-${id}`).style.width = `${perc}%`;
            }
        }

        // --- PAYMENT & VOTE LOGIC ---
        window.payWithPaystack = function() {
            const votesInput = parseInt(document.getElementById('voteCount').value) || 1;
            const voterPhone = document.getElementById('voterPhone').value.trim();
            const candidateName = document.getElementById('modalCandidateName').innerText;
            const statusDiv = document.getElementById('statusMessage');

            let handler = PaystackPop.setup({
                key: 'pk_live_e49dd0b7103780b1b4f7eb6baf2493cc15e199fe', 
                email: `voter_${new Date().getTime()}@fanvote.com`,
                amount: votesInput * COST_PER_VOTE * 100,
                currency: 'KES',
                callback: function(response) {
                    const candidateRef = ref(db, `votes/${currentCandidateId}`);
                    get(candidateRef).then((snapshot) => {
                        const currentCount = snapshot.exists() ? snapshot.val() : 0;
                        set(candidateRef, currentCount + votesInput).then(() => {
                            statusDiv.innerText = "Success! Votes recorded!";
                            setTimeout(() => { window.closeModal(); }, 2000);
                        });
                    });
                }
            });
            handler.openIframe();
        }

        // Global UI Functions
        window.openModal = (name, id) => { currentCandidateId = id; document.getElementById('modalCandidateName').innerText = name; document.getElementById('voteModal').classList.remove('hidden'); }
        window.closeModal = () => document.getElementById('voteModal').classList.add('hidden');
        window.updateCost = () => document.getElementById('instructionCost').innerText = `KSh ${document.getElementById('voteCount').value * COST_PER_VOTE}`;
    </script>
</head>
<body class="bg-emerald-950 font-sans text-gray-100 min-h-screen">
    <!-- ... [Rest of your HTML UI code remains the same] ... -->

</body>
</html>
